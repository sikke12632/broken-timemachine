<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고장 난 타임머신</title>
<link rel="stylesheet" href="css/game.css?v=3">
</head>
<body data-screen="home">
<canvas id="cv"></canvas>
<div id="labels"></div>

<!-- 처음 화면 -->
<section class="scr" id="home">
  <div class="title"><h1>고장 난 타임머신</h1><p>2~4명이 말로 설명하며 고치는 방탈출</p></div>
  <div class="btns">
    <button class="big" id="btnMake">팀 방 만들기</button>
    <button class="big alt" id="btnJoin">팀 방 들어가기</button>
  </div>
</section>

<!-- 방 번호 넣기 -->
<section class="scr" id="join">
  <div class="card keypad">
    <h2>방 번호 4자리</h2>
    <div class="code" id="joinCode"><i></i><i></i><i></i><i></i></div>
    <div class="keys" id="keys"></div>
    <p class="err" id="joinErr"></p>
    <div class="row"><button class="ghost" id="joinBack">뒤로</button><button class="go" id="joinGo" disabled>들어가기</button></div>
  </div>
</section>

<!-- 모이는 곳 -->
<section class="scr" id="lobby">
  <div class="roomcode"><span>방 번호</span><b id="lobbyCode">0000</b></div>
  <p class="tip" id="lobbyTip">친구에게 방 번호를 알려 줘요</p>
  <div class="lobby-bottom">
    <div class="level" id="levelPick"><button data-l="easy">견습</button><button data-l="mid">숙련</button></div>
    <button class="ghost" id="btnSwap">역할 바꾸기</button>
    <button class="go big" id="btnStart" disabled>출발!</button>
  </div>
  <button class="corner ghost" id="btnLeave">나가기</button>
</section>

<!-- 게임 -->
<section class="scr" id="play">
  <div class="stage"><span class="seal" id="devNo">단계1/6</span><span id="devName">전선 상자</span><button class="how-q" id="btnHow" aria-label="장치 설명서 보기">?</button></div>
  <div class="energy" id="energy">시간 에너지 <b></b><b></b><b></b><b></b><b></b></div>
  <div class="clock" id="clock">0:00</div>
  <div class="slot-tabs" id="slotTabs"></div>
  <div class="others" id="others"></div>
  <div class="me" id="meChip"><span>나</span><em>조종사</em></div>
  <div class="mate" id="mate">짝: 기록관</div>

  <div class="a-side">
    <div class="confirm" id="confirm"><span id="confirmText">3번 선을 뽑을까요?</span><button class="go" id="btnPull">뽑기</button><button class="ghost" id="btnCancel">아니요</button></div>
    <div class="task" id="task"><div class="k" id="taskK"></div><p id="taskP"></p></div>
    <div class="era-bar" id="eraBar"></div>
  </div>
  <div class="b-side"><div class="book" id="book"></div></div>
  <div class="waiting" id="waiting"><b>✓</b><span id="waitingText">우리 장치는 고쳤어요!</span></div>
  <!-- 장치 설명서 (그림 한 장) -->
  <div class="how" id="how">
    <div class="how-card">
      <div class="how-top"><span class="how-tag">장치 설명서</span><h2 id="howName"></h2><p id="howSum"></p></div>
      <div class="how-pic" id="howPic"></div>
      <ol class="how-steps" id="howSteps"></ol>
      <div class="row"><button class="ghost" id="howOff">다음부터 안 보기</button><button class="go" id="howOk">알겠어요!</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</section>

<!-- 탈출: 타임머신이 떠오름 -->
<section class="scr" id="fly">
  <div class="fly-title"><h2>시간의 문이 열렸어요!</h2><p>타임머신이 다시 날아올라요</p></div>
</section>

<!-- 끝 -->
<section class="scr" id="result">
  <div class="card end">
    <h2 id="endTitle">탈출 성공!</h2>
    <p id="endText"></p>
    <div class="row"><button class="ghost" id="btnHome">처음으로</button><button class="go" id="btnAgain">한 판 더 (역할 바꿔서)</button></div>
  </div>
</section>

<!-- 옵션 -->
<button class="opt-btn ghost" id="btnOpt" aria-label="옵션">⚙ 옵션</button>
<div class="opts" id="opts">
  <div class="card">
    <h2>옵션</h2>
    <div class="opt-row"><span>게임 전 장치 설명서<small>장치가 처음 나올 때 그림 설명서를 보여 줘요</small></span><button class="toggle" id="optHow">켜짐</button></div>
    <div class="row"><button class="go" id="optClose">닫기</button></div>
  </div>
</div>

<div id="netErr"></div>

<script src="lib/three.min.js"></script>
<script src="js/toy.js"></script>
<script src="js/props.js"></script>
<script src="js/joseon-models.js"></script>
<script src="js/scene.js?v=3"></script>
<script src="js/icons.js?v=3"></script>
<script src="js/relics.js?v=3"></script>
<script src="js/dev-wires.js?v=3"></script>
<script src="js/dev-net.js?v=3"></script>
<script src="js/dev-outside.js?v=3"></script>
<script src="js/dev-door.js?v=3"></script>
<script src="js/dev-round.js?v=3"></script>
<script src="js/dev-flash.js?v=3"></script>
<script src="js/dev-maze.js?v=3"></script>
<script src="js/dev-new2.js?v=3"></script>
<script type="module" src="js/app.js?v=3"></script>
</body>
</html>
